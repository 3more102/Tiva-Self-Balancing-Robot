name: Controller and documentation CI
on: [push, pull_request]

jobs:
  host-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TinyML training dependency
        run: python -m pip install -r ai/requirements.txt
      - name: Compile portable C with strict warnings
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/controller.c tests/test_controller.c \
            -lm -o /tmp/test_controller
      - name: Run sensor, PID and safety unit tests
        run: /tmp/test_controller
      - name: Run with undefined-behavior sanitizer
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ifirmware/tiva/include \
            firmware/tiva/src/controller.c tests/test_controller.c \
            -lm -o /tmp/test_controller_ubsan
          /tmp/test_controller_ubsan
      - name: Compile and run gyro calibration / timing diagnostics
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/diagnostics.c tests/test_diagnostics.c \
            -lm -o /tmp/test_diagnostics
          /tmp/test_diagnostics
      - name: Undefined behavior sanitizer for diagnostics
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ifirmware/tiva/include \
            firmware/tiva/src/diagnostics.c tests/test_diagnostics.c \
            -lm -o /tmp/test_diagnostics_ubsan
          /tmp/test_diagnostics_ubsan
      - name: Compile and run obstacle-navigation policy tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/navigation.c tests/test_navigation.c \
            -lm -o /tmp/test_navigation
          /tmp/test_navigation
      - name: Compile and run asynchronous range-sensor capture tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/range_sensing.c tests/test_range_sensing.c \
            -o /tmp/test_range_sensing
          /tmp/test_range_sensing
      - name: Range-sensor capture undefined-behavior sanitizer
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ifirmware/tiva/include \
            firmware/tiva/src/range_sensing.c tests/test_range_sensing.c \
            -o /tmp/test_range_sensing_ubsan
          /tmp/test_range_sensing_ubsan
      - name: Compile and run AI sensor-frame adapter tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/ai_sensor_adapter.c tests/test_ai_sensor_adapter.c \
            -lm -o /tmp/test_ai_sensor_adapter
          /tmp/test_ai_sensor_adapter
      - name: Compile and run range-to-TinyML integration tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/range_sensing.c \
            firmware/tiva/src/ai_sensor_adapter.c \
            firmware/tiva/src/ai_inference.c \
            firmware/tiva/src/ai_navigation.c \
            tests/test_ai_range_integration.c -lm -o /tmp/test_ai_range_integration
          /tmp/test_ai_range_integration
      - name: Compile and run TinyML inference tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/ai_inference.c firmware/tiva/src/ai_navigation.c \
            tests/test_ai_navigation.c -lm -o /tmp/test_ai_navigation
          /tmp/test_ai_navigation
      - name: TinyML inference undefined-behavior sanitizer
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ifirmware/tiva/include \
            firmware/tiva/src/ai_inference.c firmware/tiva/src/ai_navigation.c \
            tests/test_ai_navigation.c -lm -o /tmp/test_ai_navigation_ubsan
          /tmp/test_ai_navigation_ubsan
      - name: Test deterministic TinyML dataset generation
        run: python -m unittest discover -s tests -p "test_ai_dataset.py" -v
      - name: Train TinyML model smoke test
        run: |
          python ai/train_model.py --samples 10000 --epochs 30 \
            --output /tmp/ai_model_weights.h --metrics /tmp/ai_model_metrics.json
      - name: Test theoretical pitch-only simulation
        run: python3 -m unittest discover -s tests -p "test_simulation.py" -v
      - name: Generate deterministic theoretical simulation outputs
        run: |
          python3 simulation/run_pitch_sim.py --angle 4 --output /tmp/robot_pitch_PD_THEORETICAL.csv
          python3 simulation/run_pitch_sim.py --angle 4 --open-loop --output /tmp/robot_pitch_OPEN_LOOP_THEORETICAL.csv
      - name: Validate documentation internal links
        run: python3 tools/check_docs.py
