name: Controller and documentation CI
on: [push, pull_request]

jobs:
  host-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable C with strict warnings
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/controller.c tests/test_controller.c \
            -lm -o /tmp/test_controller
      - name: Run sensor, PID and safety unit tests
        run: /tmp/test_controller
      - name: Run with undefined-behavior sanitizer
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ifirmware/tiva/include \
            firmware/tiva/src/controller.c tests/test_controller.c \
            -lm -o /tmp/test_controller_ubsan
          /tmp/test_controller_ubsan
      - name: Compile and run gyro calibration / timing diagnostics
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/tiva/include \
            firmware/tiva/src/diagnostics.c tests/test_diagnostics.c \
            -lm -o /tmp/test_diagnostics
          /tmp/test_diagnostics
      - name: Undefined behavior sanitizer for diagnostics
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ifirmware/tiva/include \
            firmware/tiva/src/diagnostics.c tests/test_diagnostics.c \
            -lm -o /tmp/test_diagnostics_ubsan
          /tmp/test_diagnostics_ubsan
      - name: Validate documentation internal links
        run: python3 tools/check_docs.py
